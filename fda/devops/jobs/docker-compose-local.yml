version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: capstone-mongodb
    ports:
      - "30000:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: admin
    networks:
      - capstone-network
    volumes:
      - mongodb-data:/data/db

  authentication:
    image: services-authentication:latest
    container_name: capstone-authentication
    ports:
      - "30001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - MONGO_CONNECTION_STRING=${MONGO_AUTH_CONNECTION}
      - ConnectionStrings__DefaultConnection=${MONGO_AUTH_CONNECTION}
      - DatabaseSettings__ConnectionString=${MONGO_AUTH_CONNECTION}
      - DatabaseSettings__DatabaseName=${MONGO_AUTH_DB}
      - DatabaseSettings__CollectionName=${AUTH_COLLECTION}
    depends_on:
      - mongodb
    networks:
      - capstone-network

  catalog:
    image: services-catalog:latest
    container_name: capstone-catalog
    ports:
      - "30002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - MONGO_CONNECTION_STRING=${MONGO_CATALOG_CONNECTION}
      - ConnectionStrings__DefaultConnection=${MONGO_CATALOG_CONNECTION}
      - DatabaseSettings__ConnectionString=${MONGO_CATALOG_CONNECTION}
      - DatabaseSettings__DatabaseName=${MONGO_CATALOG_DB}
      - DatabaseSettings__CollectionName=${CATALOG_COLLECTION}
    depends_on:
      - mongodb
    networks:
      - capstone-network

  crm:
    image: services-crm:latest
    container_name: capstone-crm
    ports:
      - "30003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - MONGO_CONNECTION_STRING=${MONGO_CRM_CONNECTION}
      - ConnectionStrings__DefaultConnection=${MONGO_CRM_CONNECTION}
      - DatabaseSettings__ConnectionString=${MONGO_CRM_CONNECTION}
      - DatabaseSettings__DatabaseName=${MONGO_CRM_DB}
      - DatabaseSettings__CollectionName=${CRM_COLLECTION}
    depends_on:
      - mongodb
    networks:
      - capstone-network

  cart:
    image: services-cart:latest
    container_name: capstone-cart
    ports:
      - "30004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - MONGO_CONNECTION_STRING=${MONGO_CART_CONNECTION}
      - ConnectionStrings__DefaultConnection=${MONGO_CART_CONNECTION}
      - DatabaseSettings__ConnectionString=${MONGO_CART_CONNECTION}
      - DatabaseSettings__DatabaseName=${MONGO_CART_DB}
      - DatabaseSettings__CollectionName=${CART_COLLECTION}
    depends_on:
      - mongodb
    networks:
      - capstone-network

networks:
  capstone-network:
    driver: bridge

volumes:
  mongodb-data:
