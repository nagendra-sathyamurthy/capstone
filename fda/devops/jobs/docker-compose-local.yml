version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: capstone-mongodb
    ports:
      - "30000:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: AdminPass2024
      MONGO_INITDB_DATABASE: admin
    networks:
      - capstone-network
    volumes:
      - mongodb-data:/data/db

  authentication:
    image: services-authentication:latest
    container_name: capstone-authentication
    ports:
      - "30001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=mongodb://admin:AdminPass2024@mongodb:27017/authenticationdb?authSource=admin
      - DatabaseSettings__ConnectionString=mongodb://admin:AdminPass2024@mongodb:27017/authenticationdb?authSource=admin
      - DatabaseSettings__DatabaseName=authenticationdb
      - DatabaseSettings__CollectionName=users
    depends_on:
      - mongodb
    networks:
      - capstone-network

  catalog:
    image: services-catalog:latest
    container_name: capstone-catalog
    ports:
      - "30002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=mongodb://admin:AdminPass2024@mongodb:27017/catalogdb?authSource=admin
      - DatabaseSettings__ConnectionString=mongodb://admin:AdminPass2024@mongodb:27017/catalogdb?authSource=admin
      - DatabaseSettings__DatabaseName=catalogdb
      - DatabaseSettings__CollectionName=items
    depends_on:
      - mongodb
    networks:
      - capstone-network

  crm:
    image: services-crm:latest
    container_name: capstone-crm
    ports:
      - "30003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=mongodb://admin:AdminPass2024@mongodb:27017/crmdb?authSource=admin
      - DatabaseSettings__ConnectionString=mongodb://admin:AdminPass2024@mongodb:27017/crmdb?authSource=admin
      - DatabaseSettings__DatabaseName=crmdb
      - DatabaseSettings__CollectionName=customers
    depends_on:
      - mongodb
    networks:
      - capstone-network

  cart:
    image: services-cart:latest
    container_name: capstone-cart
    ports:
      - "30004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=mongodb://admin:AdminPass2024@mongodb:27017/cartdb?authSource=admin
      - DatabaseSettings__ConnectionString=mongodb://admin:AdminPass2024@mongodb:27017/cartdb?authSource=admin
      - DatabaseSettings__DatabaseName=cartdb
      - DatabaseSettings__CollectionName=carts
    depends_on:
      - mongodb
    networks:
      - capstone-network

networks:
  capstone-network:
    driver: bridge

volumes:
  mongodb-data:
