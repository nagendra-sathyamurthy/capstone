version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: capstone-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    volumes:
      - mongodb_data:/data/db
    networks:
      - capstone-network
    secrets:
      - mongo_root_username
      - mongo_root_password
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Authentication Service
  authentication:
    build:
      context: ../../src/services
      dockerfile: authentication/Dockerfile
    container_name: capstone-authentication
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JwtSettings__Issuer=CapstoneAuthService
      - JwtSettings__Audience=CapstoneApp
      - JwtSettings__ExpirationMinutes=60
    secrets:
      - mongo_connection_string
      - jwt_secret_key
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - capstone-network
    restart: unless-stopped

  # Catalog Service
  catalog:
    build:
      context: ../../src/services
      dockerfile: catalog/Dockerfile
    container_name: capstone-catalog
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    secrets:
      - mongo_connection_string
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - capstone-network
    restart: unless-stopped

  # CRM Service
  crm:
    build:
      context: ../../src/services
      dockerfile: crm/Dockerfile
    container_name: capstone-crm
    ports:
      - "8083:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    secrets:
      - mongo_connection_string_crm
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - capstone-network
    restart: unless-stopped

  # Cart Service
  cart:
    build:
      context: ../../src/services
      dockerfile: cart/Dockerfile
    container_name: capstone-cart
    ports:
      - "8084:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    secrets:
      - mongo_connection_string
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - capstone-network
    restart: unless-stopped

  # Order Service
  order:
    build:
      context: ../../src/services
      dockerfile: order/Dockerfile
    container_name: capstone-order
    ports:
      - "8085:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    secrets:
      - mongo_connection_string
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - capstone-network
    restart: unless-stopped

  # API Gateway
  gateway:
    build:
      context: ../../src/gateway
      dockerfile: Dockerfile
    container_name: capstone-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://authentication:8080
      - CATALOG_SERVICE_URL=http://catalog:8080
      - CRM_SERVICE_URL=http://crm:8080
      - CART_SERVICE_URL=http://cart:8080
      - ORDER_SERVICE_URL=http://order:8080
      - CORS_ORIGIN=http://localhost:3000
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - LOG_LEVEL=info
    depends_on:
      - authentication
      - catalog
      - crm
      - cart
      - order
    networks:
      - capstone-network
    restart: unless-stopped

  # Customer Web App
  customer-app:
    build:
      context: ../../src/customer-app
      dockerfile: Dockerfile
      args:
        - REACT_APP_GATEWAY_URL=http://localhost:5000
    container_name: capstone-customer-app
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_GATEWAY_URL=http://localhost:5000
      - REACT_APP_ENV=development
    depends_on:
      - gateway
    networks:
      - capstone-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local

networks:
  capstone-network:
    driver: bridge

secrets:
  mongo_root_username:
    file: ./secrets/mongo_root_username.txt
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
  mongo_connection_string:
    file: ./secrets/mongo_connection_string.txt
  mongo_connection_string_crm:
    file: ./secrets/mongo_connection_string_crm.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
