version: '3.8'

# Simplified Docker Compose for local development
# Only runs backend services, assumes frontend runs via npm start

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: capstone-mongodb-dev
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: AdminPass2024
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - capstone-dev-network
    restart: unless-stopped

  # API Gateway
  gateway:
    build:
      context: ../../src/gateway
      dockerfile: Dockerfile
    container_name: capstone-gateway-dev
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - AUTH_SERVICE_URL=http://host.docker.internal:30001
      - CATALOG_SERVICE_URL=http://host.docker.internal:30002
      - CRM_SERVICE_URL=http://host.docker.internal:30003
      - CART_SERVICE_URL=http://host.docker.internal:30004
      - ORDER_SERVICE_URL=http://host.docker.internal:30006
      - PAYMENT_SERVICE_URL=http://host.docker.internal:30007
      - CORS_ORIGIN=http://localhost:3000
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - LOG_LEVEL=debug
    networks:
      - capstone-dev-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongodb_data_dev:
    driver: local

networks:
  capstone-dev-network:
    driver: bridge
