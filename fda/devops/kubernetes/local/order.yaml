# Local Development - Order Service
# Uses shared MongoDB instance (mongodb-service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
  namespace: capstone-services
  labels:
    app: order
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
        environment: local
    spec:
      containers:
      - name: order
        image: services-order:latest
        imagePullPolicy: Never  # Use local image
        ports:
        - containerPort: 8080
        # Load common environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: common-service-config
        # Service-specific environment variables
        env:
        # MongoDB connection string (GetSecret looks for MONGO_CONNECTION_STRING)
        - name: MONGO_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: order-connection-string
        # Database-specific settings
        - name: DatabaseSettings__DatabaseName
          value: "orderdb"
        - name: DatabaseSettings__CollectionName
          value: "orders"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: capstone-services
  labels:
    environment: local
spec:
  selector:
    app: order
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP