apiVersion: v1
kind: Namespace
metadata:
  name: capstone-frontend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-app-config
  namespace: capstone-frontend
data:
  REACT_APP_GATEWAY_URL: "http://localhost:30500"  # Updated to match new gateway NodePort
  REACT_APP_ENV: "development"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-app
  namespace: capstone-frontend
  labels:
    app: customer-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-app
  template:
    metadata:
      labels:
        app: customer-app
    spec:
      containers:
      - name: customer-app
        image: capstone-customer-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: customer-app-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: customer-app-service
  namespace: capstone-frontend
  labels:
    app: customer-app
spec:
  type: NodePort
  selector:
    app: customer-app
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30300  # Customer App - aligned with docker-compose port 3000
    protocol: TCP
    name: http
