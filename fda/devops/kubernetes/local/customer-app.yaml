apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-app-config
  namespace: capstone-services
data:
  REACT_APP_GATEWAY_URL: "http://localhost:30500"  # Updated to match new gateway NodePort
  REACT_APP_ENV: "development"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-app
  namespace: capstone-services
  labels:
    app: customer-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-app
  template:
    metadata:
      labels:
        app: customer-app
    spec:
      containers:
      - name: customer-app
        image: customer-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: customer-app-config
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: customer-app-service
  namespace: capstone-services
  labels:
    app: customer-app
spec:
  type: ClusterIP
  selector:
    app: customer-app
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
