# Local Development - CRM Service
# Uses shared MongoDB instance (mongodb-service) instead of dedicated database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-deployment
  namespace: capstone-services
  labels:
    app: crm
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm
  template:
    metadata:
      labels:
        app: crm
        environment: local
    spec:
      containers:
      - name: crm
        image: services-crm:latest
        imagePullPolicy: Never  # Use local image
        ports:
        - containerPort: 8080
        # Load common environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: common-service-config
        # Service-specific environment variables
        env:
        # MongoDB connection string (GetSecret looks for MONGO_CONNECTION_STRING)
        # Note: CRM service looks for "mongo_connection_string_crm" but GetSecret will find MONGO_CONNECTION_STRING_CRM
        - name: MONGO_CONNECTION_STRING_CRM
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: crm-connection-string
        # Database-specific settings (NOTE: .NET maps DATABASE_SETTINGS__DATABASE_NAME to DatabaseSettings:DatabaseName)
        - name: DATABASE_SETTINGS__DATABASE_NAME
          value: "crmdb"
        - name: DATABASE_SETTINGS__COLLECTION_NAME
          value: "customers"
---
apiVersion: v1
kind: Service
metadata:
  name: crm-service
  namespace: capstone-services
  labels:
    environment: local
spec:
  selector:
    app: crm
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP