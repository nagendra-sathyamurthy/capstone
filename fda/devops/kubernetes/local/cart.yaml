# Local Development - Cart Service
# Uses shared MongoDB instance (mongodb-service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-deployment
  namespace: capstone-services
  labels:
    app: cart
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
        environment: local
    spec:
      containers:
      - name: cart
        image: services-cart:latest
        imagePullPolicy: Never  # Use local image
        ports:
        - containerPort: 8080
        # Load common environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: common-service-config
        # Service-specific environment variables
        env:
        # MongoDB connection string (GetSecret looks for MONGO_CONNECTION_STRING)
        - name: MONGO_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: cart-connection-string
        # Database-specific settings (NOTE: .NET maps DATABASE_SETTINGS__DATABASE_NAME to DatabaseSettings:DatabaseName)
        - name: DATABASE_SETTINGS__DATABASE_NAME
          value: "cartdb"
        - name: DATABASE_SETTINGS__COLLECTION_NAME
          value: "carts"
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: capstone-services
  labels:
    environment: local
spec:
  selector:
    app: cart
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP