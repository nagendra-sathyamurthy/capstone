# Local Development - Catalog Service
# Uses shared MongoDB instance (mongodb-service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-deployment
  namespace: capstone-services
  labels:
    app: catalog
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
        environment: local
    spec:
      containers:
      - name: catalog
        image: services-catalog:latest
        imagePullPolicy: Never  # Use local image
        ports:
        - containerPort: 8080
        # Load common environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: common-service-config
        # Service-specific environment variables
        env:
        - name: MONGO_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: catalog-connection-string
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: catalog-connection-string
        - name: DatabaseSettings__ConnectionString
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: catalog-connection-string
        - name: DatabaseSettings__DatabaseName
          value: "catalogdb"
        - name: DatabaseSettings__CollectionName
          value: "menuitems"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: capstone-services
  labels:
    environment: local
spec:
  selector:
    app: catalog
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP