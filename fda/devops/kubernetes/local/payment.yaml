# Local Development - Payment Service
# Uses shared MongoDB instance (mongodb-service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-deployment
  namespace: capstone-services
  labels:
    app: payment
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
        environment: local
    spec:
      containers:
      - name: payment
        image: services-payment:latest
        imagePullPolicy: Never  # Use local image
        ports:
        - containerPort: 8080
        # Load common environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: common-service-config
        # Service-specific environment variables
        env:
        - name: MONGO_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: payment-connection-string
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: payment-connection-string
        - name: DatabaseSettings__ConnectionString
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: payment-connection-string
        - name: DatabaseSettings__DatabaseName
          value: "paymentdb"
        - name: DatabaseSettings__CollectionName
          value: "payments"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: capstone-services
  labels:
    environment: local
spec:
  selector:
    app: payment
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP