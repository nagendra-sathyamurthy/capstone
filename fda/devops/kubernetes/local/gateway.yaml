apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: capstone-services
data:
  PORT: "5000"
  NODE_ENV: "development"
  AUTH_SERVICE_URL: "http://authentication-service:8080"
  CATALOG_SERVICE_URL: "http://catalog-service:8080"
  CRM_SERVICE_URL: "http://crm-service:8080"
  CART_SERVICE_URL: "http://cart-service:8080"
  ORDER_SERVICE_URL: "http://order-service:8080"
  CORS_ORIGIN: "http://localhost:3000"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: capstone-services
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: gateway-config
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: capstone-services
  labels:
    app: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500
    protocol: TCP
    name: http
