# Local Development - Authentication Service
# Uses shared MongoDB instance (mongodb-service)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication-deployment
  namespace: capstone-services
  labels:
    app: authentication
    environment: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication
  template:
    metadata:
      labels:
        app: authentication
        environment: local
    spec:
      containers:
      - name: authentication
        image: services-authentication:latest
        imagePullPolicy: Never  # Use local image
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: MONGO_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: mongodb-secret  # Uses shared MongoDB secret
              key: auth-connection-string
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: mongodb-secret  # Uses shared MongoDB secret
              key: auth-connection-string
        - name: DatabaseSettings__ConnectionString
          valueFrom:
            secretKeyRef:
              name: mongodb-secret  # Uses shared MongoDB secret
              key: auth-connection-string
        - name: DatabaseSettings__DatabaseName
          value: "authenticationdb"
        - name: DatabaseSettings__CollectionName
          value: "users"
---
apiVersion: v1
kind: Service
metadata:
  name: authentication-service
  namespace: capstone-services
  labels:
    environment: local
spec:
  selector:
    app: authentication
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP