apiVersion: v1
kind: Namespace
metadata:
  name: capstone-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: capstone-gateway
data:
  PORT: "5000"
  NODE_ENV: "production"
  AUTH_SERVICE_URL: "http://authentication-service.capstone-services.svc.cluster.local:8080"
  CATALOG_SERVICE_URL: "http://catalog-service.capstone-services.svc.cluster.local:8080"
  CRM_SERVICE_URL: "http://crm-service.capstone-services.svc.cluster.local:8080"
  CART_SERVICE_URL: "http://cart-service.capstone-services.svc.cluster.local:8080"
  ORDER_SERVICE_URL: "http://order-service.capstone-services.svc.cluster.local:8080"
  PAYMENT_SERVICE_URL: "http://payment-service.capstone-services.svc.cluster.local:8080"
  CORS_ORIGIN: "https://your-production-domain.com"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: capstone-gateway
  labels:
    app: gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: your-registry/capstone-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: gateway-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: capstone-gateway
  labels:
    app: gateway
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: capstone-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
