# TLS/SSL Certificate Configuration for Production
# This file contains certificate secrets and issuer configuration
# 
# OPTION 1: Using cert-manager (Recommended for automatic certificate management)
# Install cert-manager first: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml
#
# OPTION 2: Manual certificate creation (for self-signed or existing certificates)
# Use the TLS secret configuration below
---
# ClusterIssuer for Let's Encrypt (Production)
# Uncomment this section if using cert-manager with Let's Encrypt
# apiVersion: cert-manager.io/v1
# kind: ClusterIssuer
# metadata:
#   name: letsencrypt-prod
# spec:
#   acme:
#     server: https://acme-v02.api.letsencrypt.org/directory
#     email: your-email@example.com  # CHANGE THIS
#     privateKeySecretRef:
#       name: letsencrypt-prod
#     solvers:
#     - http01:
#         ingress:
#           class: nginx
---
# ClusterIssuer for Let's Encrypt (Staging - for testing)
# apiVersion: cert-manager.io/v1
# kind: ClusterIssuer
# metadata:
#   name: letsencrypt-staging
# spec:
#   acme:
#     server: https://acme-staging-v02.api.letsencrypt.org/directory
#     email: your-email@example.com  # CHANGE THIS
#     privateKeySecretRef:
#       name: letsencrypt-staging
#     solvers:
#     - http01:
#         ingress:
#           class: nginx
---
# Self-Signed Certificate Issuer (for development/testing)
# Uncomment if using cert-manager with self-signed certificates
# apiVersion: cert-manager.io/v1
# kind: ClusterIssuer
# metadata:
#   name: selfsigned-issuer
# spec:
#   selfSigned: {}
---
# Manual TLS Secret for Services (if not using cert-manager)
# Create certificate files first, then create secret:
# kubectl create secret tls capstone-services-tls \
#   --cert=path/to/tls.crt \
#   --key=path/to/tls.key \
#   -n capstone-services
#
# Or use this template after base64 encoding your certificate:
# apiVersion: v1
# kind: Secret
# metadata:
#   name: capstone-services-tls
#   namespace: capstone-services
# type: kubernetes.io/tls
# data:
#   tls.crt: <base64-encoded-certificate>
#   tls.key: <base64-encoded-private-key>
---
# Manual TLS Secret for Gateway (if not using cert-manager)
# kubectl create secret tls capstone-gateway-tls \
#   --cert=path/to/tls.crt \
#   --key=path/to/tls.key \
#   -n capstone-gateway
---
# Manual TLS Secret for Frontend (if not using cert-manager)
# kubectl create secret tls capstone-frontend-tls \
#   --cert=path/to/tls.crt \
#   --key=path/to/tls.key \
#   -n capstone-frontend
---
# Certificate Resource (if using cert-manager)
# This will automatically generate and renew certificates
