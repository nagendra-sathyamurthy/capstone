# kind: Certificate
# metadata:
#   name: capstone-services-cert
#   namespace: capstone-services
# spec:
#   secretName: capstone-services-tls
#   issuerRef:
#     name: letsencrypt-prod
#     kind: ClusterIssuer
#   commonName: api.your-domain.com
#   dnsNames:
#   - api.your-domain.com
#   - auth.your-domain.com
#   - catalog.your-domain.com
#   - crm.your-domain.com
#   - cart.your-domain.com
#   - order.your-domain.com
#   - payment.your-domain.com
---
# Certificate for Gateway
