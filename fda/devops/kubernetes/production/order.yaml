# Production - Order Service with Dedicated MongoDB
# Dedicated MongoDB instance for order service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-mongodb-deployment
  namespace: capstone-services
  labels:
    app: order-mongodb
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-mongodb
  template:
    metadata:
      labels:
        app: order-mongodb
        environment: production
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: order-mongodb-secret
              key: username
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: order-mongodb-secret
              key: password
        - name: MONGO_INITDB_DATABASE
          value: "orderdb"
        volumeMounts:
        - name: order-mongodb-storage
          mountPath: /data/db
      volumes:
      - name: order-mongodb-storage
        persistentVolumeClaim:
          claimName: order-mongodb-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-mongodb-pvc
  namespace: capstone-services
  labels:
    environment: production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi  # Larger storage for order data
---
apiVersion: v1
kind: Service
metadata:
  name: order-mongodb-service
  namespace: capstone-services
  labels:
    environment: production
spec:
  selector:
    app: order-mongodb
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
  namespace: capstone-services
  labels:
    app: order
    environment: production
spec:
  replicas: 3  # High availability for orders
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
        environment: production
    spec:
      containers:
      - name: order
        image: services-order:latest
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: order-mongodb-secret
              key: connection-string
        - name: DatabaseSettings__ConnectionString
          valueFrom:
            secretKeyRef:
              name: order-mongodb-secret
              key: connection-string
        - name: DatabaseSettings__DatabaseName
          value: "orderdb"
        - name: DatabaseSettings__CollectionName
          value: "orders"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: capstone-services
  labels:
    environment: production
spec:
  selector:
    app: order
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: ClusterIP
